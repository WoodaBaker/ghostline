[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "kiru-ghostline"
version = "0.1.0"
description = "Behavioral diagnostics for AI agents: probe for known failure modes, watch for drift, document new ones."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Antwan Baker" }]
keywords = ["ai", "agents", "evaluation", "safety", "diagnostics", "dem-x"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.17.0", "build==1.6.1", "twine==7.0.0"]
mcp = ["mcp>=1.0"]

[project.urls]
Homepage = "https://kiru.solutions/ghostline"
Repository = "https://github.com/WoodaBaker/ghostline"
Issues = "https://github.com/WoodaBaker/ghostline/issues"

[project.scripts]
ghostline = "kiru_ghostline.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/kiru_ghostline"]
